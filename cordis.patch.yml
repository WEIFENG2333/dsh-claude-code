# Claude Code compatibility surface over the installed DSH profile. It reuses
# the profile's model/provider routing and requires no DSH source modification.

# Headless owns this row globally; Web keeps its preset-scoped native web tool.
- id: tool-web
  config:
    fetch: true

- insert:
    - id: web-fetch-http
      name: 'dsh-claude-code/web-fetch-provider'

    - id: claude-code-compat
      name: dsh-claude-code
