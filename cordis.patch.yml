# Claude Code mode over the shipped DSH bundle. Web receives an independent
# agent preset; headless retains its one global agent surface.

# Headless owns model-facing rows globally. The Web host copy is disabled, so
# this does not change Standard mode's scoped web tool.
- id: tool-web
  config:
    fetch: true

- insert:
    - id: web-fetch-http
      name: 'dsh-claude-code/web-fetch-provider'

    - id: claude-code-mode
      name: dsh-claude-code
